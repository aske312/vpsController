# 312.net — параметры первичной установки
# Файл читается только менеджером vps-control и не передаётся веб-приложению.

# external — панель доступна по публичному IP (режим по умолчанию)
# local    — панель слушает локальный IPv4 и доступна только из LOCAL_CIDR
# vpn      — панель доступна только через интерфейс AmneziaWG
ACCESS_MODE="external"

# Логин администратора. Пароль генерируется при первой установке и сохраняется в /etc/vps-control.env.
ADMIN_USER="admin"
ADMIN_PASSWORD=""

# Необязательно: домен панели без https://. HTTPS включится, когда DNS укажет на публичный IP сервера.
PUBLIC_DOMAIN=""

# Для local пустые значения определяются из основного IPv4-маршрута сервера.
LOCAL_ADDRESS=""
LOCAL_CIDR=""

# Сетевые порты
HTTP_PORT="80"
AWG_PORT="51822"
HYSTERIA2_PORT="8443"
TUIC_PORT="8444"
XRAY_PORT="8445"

# VPN-интерфейсы
AWG_INTERFACE="awg0"

# Устойчивый профиль AmneziaWG. S/H должны совпадать на сервере и клиентах.
AWG_MTU="1280"
AWG_JC="6"
AWG_JMIN="8"
AWG_JMAX="80"
AWG_S1="64"
AWG_S2="112"
AWG_H1="150000000"
AWG_H2="600000000"
AWG_H3="1000000000"
AWG_H4="1400000000"

# Управление системным firewall
ENABLE_UFW="yes"

# Основной и резервный сервисы используются только во время install/update/identity.
GEOLOCATION_PRIMARY_URL="https://api.2ip.io"
GEOLOCATION_FALLBACK_URL="https://ipwho.is/?fields=success,ip,city,country,country_code,latitude,longitude"
GEOLOCATION_TERTIARY_URL="https://ip.guide"
GEOLOCATION_QUATERNARY_URL="https://ipapi.co"
GEOLOCATION_QUINARY_URL="https://free.freeipapi.com/api/json"
GEOLOCATION_SENARY_URL="https://ipinfo.io"
PUBLIC_IP_DISCOVERY_URL="https://api64.ipify.org"

# GeoIP определяет локацию хостинга приблизительно. Если город определён неверно,
# задайте подтверждённые значения: они не будут перезаписаны при обновлении.
SERVER_CITY_OVERRIDE=""
SERVER_COUNTRY_OVERRIDE=""
SERVER_COUNTRY_CODE_OVERRIDE=""
