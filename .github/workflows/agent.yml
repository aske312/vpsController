name: Verify standalone Agent installer
on:
  workflow_dispatch:
  push:
    branches: [agent, test-agent]
  pull_request:
    branches: [agent, test-agent]
permissions:
  contents: read
jobs:
  stream-regressions:
    name: Stream regressions (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check terminal errors, idle activity and half-close
        run: |
          python tests/relay_agent_test.py AgentTests.test_cached_stream_errors_are_terminal_in_both_directions_and_free_resources AgentTests.test_route_shutdown_cancels_idle_pumps_and_releases_the_shared_budget AgentTests.test_one_way_tcp_stream_outlives_idle_timeout_in_both_directions AgentTests.test_truly_idle_tcp_session_is_still_closed AgentTests.test_real_tcp_roundtrip_supports_half_close_and_counters
          python tests/relay_security_test.py
          python tests/relay_diagnostics_test.py
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: installer
          path: .runtime/installer
      - name: Check installer routing to Agent
        run: |
          bash -n .runtime/installer/install.sh
          sudo python3 tests/installer_routing_test.py
      - name: Check shell syntax and credentials export
        run: |
          bash -n install.sh scripts/install-agent.sh protocol-images/relay-agent/install.sh protocol-images/relay-agent/uninstall.sh
          python3 tests/relay_standalone_test.py
          python3 tests/relay_agent_test.py
          python3 tests/relay_diagnostics_test.py
          python3 tests/relay_security_test.py
          python3 tests/relay_update_test.py
      - name: Install twice in isolated namespaces without a panel
        run: |
          sudo python3 tests/relay_standalone_smoke.py .
          sudo python3 tests/relay_standalone_smoke.py . --occupy-default
          sudo python3 tests/relay_standalone_smoke.py . --api-port 19443
      - name: Verify authenticated manual update through systemd
        run: sudo python3 tests/relay_update_smoke.py
      - name: Verify native runtime networking inside the Agent sandbox
        run: sudo python3 tests/relay_systemd_smoke.py
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/agent' || github.ref == 'refs/heads/test-agent')
    needs: [verify, stream-regressions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: agent-release-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Package tested Agent
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('protocol-images/relay-agent/manifest.json')
          value = json.loads(path.read_text()); value['source_branch'] = os.environ['SOURCE_BRANCH']
          path.write_text(json.dumps(value))
          PY
          tar -czf relay-agent.tar.gz -C protocol-images/relay-agent agent.py addresses.py credentials.py manifest.json install.sh uninstall.sh update.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          version = json.loads(Path('protocol-images/relay-agent/manifest.json').read_text())['version']
          digest = 'sha256:' + hashlib.sha256(Path('relay-agent.tar.gz').read_bytes()).hexdigest()
          Path('relay-agent-version.json').write_text(json.dumps({'version': version, 'digest': digest}))
          PY
      - name: Publish Agent update
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name == 'test-agent' && 'agent-test-latest' || 'agent-latest' }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --title 'Relay Agent' --notes 'Published after Agent verification.' --target "$GITHUB_SHA" --prerelease
          gh release upload "$RELEASE_TAG" relay-agent.tar.gz --clobber
          gh release upload "$RELEASE_TAG" relay-agent-version.json --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA"
