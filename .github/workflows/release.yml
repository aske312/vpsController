name: Publish PRO release

on:
  push:
    branches: [pro, test-pro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pro-${{ github.ref_name }}-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests/api -t . -p 'test_*.py'
      - run: npm ci --include=dev --include=optional --ignore-scripts
      - run: npm run check

  build:
    needs: verify
    if: needs.verify.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Select application version
        id: version
        shell: bash
        run: |
          base="$(node -p 'require("./package.json").version')"
          major_minor="${base%.*}"
          latest="$(git tag --list "pro-v${major_minor}.*" --sort=-v:refname | head -n 1)"
          if [[ "$GITHUB_REF_NAME" == "test-pro" ]]; then
            [[ -n "$latest" ]] || { echo "Production PRO version tag is missing" >&2; exit 1; }
            version="${latest#pro-}"
          elif [[ -n "$latest" && "$(git rev-list -n 1 "$latest")" == "$GITHUB_SHA" ]]; then
            version="${latest#pro-}"
          elif [[ -z "$latest" ]]; then
            version="v${base}"
          else
            patch="${latest##*.}"
            version="v${major_minor}.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build PRO archive
        env:
          BUILD_COMMIT: ${{ github.sha }}
          RELEASE_EDITION: pro
          RELEASE_CHANNEL: ${{ github.ref_name == 'test-pro' && 'test' || 'production' }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh "outputs/vps-control-pro-linux-${{ matrix.architecture }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: pro-${{ matrix.architecture }}
          path: outputs/vps-control-pro-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          pattern: pro-*
          path: outputs
          merge-multiple: true
      - name: Select application version
        id: version
        shell: bash
        run: |
          base="$(node -p 'require("./package.json").version')"
          major_minor="${base%.*}"
          latest="$(git tag --list "pro-v${major_minor}.*" --sort=-v:refname | head -n 1)"
          if [[ "$GITHUB_REF_NAME" == "test-pro" ]]; then
            [[ -n "$latest" ]] || { echo "Production PRO version tag is missing" >&2; exit 1; }
            version="${latest#pro-}"
          elif [[ -n "$latest" && "$(git rev-list -n 1 "$latest")" == "$GITHUB_SHA" ]]; then
            version="${latest#pro-}"
          elif [[ -z "$latest" ]]; then
            version="v${base}"
          else
            patch="${latest##*.}"
            version="v${major_minor}.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish PRO release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "test-pro" ]]; then
            release_tag="pro-test-latest"
            release_title="Test build ${VERSION} (test-pro)"
            release_notes="Rolling PRO test build ${VERSION} for ${GITHUB_SHA}. Not a production release."
            release_flags=(--prerelease)
          else
            release_tag="pro-latest"
            release_title="PRO ${VERSION}"
            release_notes="PRO production release ${VERSION} for ${GITHUB_SHA}"
            release_flags=()
          fi
          gh release delete "$release_tag" --cleanup-tag --yes || true
          gh release create "$release_tag" outputs/vps-control-pro-linux-*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            "${release_flags[@]}" \
            --latest=false
          [[ "$GITHUB_REF_NAME" == "pro" ]] || exit 0
          version_tag="pro-${VERSION}"
          if ! git rev-parse "$version_tag" >/dev/null 2>&1; then
            git tag "$version_tag" "$GITHUB_SHA"
            git push origin "$version_tag"
          fi
