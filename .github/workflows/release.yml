name: Publish PRO release

on:
  push:
    branches: [pro, test-pro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pro-${{ github.ref_name }}-release
  cancel-in-progress: false

jobs:
  verify-api:
    name: API and Linux integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests/api -t . -p 'test_*.py'
      - name: Verify optional AI-agent MCP transports
        run: |
          python -m venv /tmp/nodera-runtime
          /tmp/nodera-runtime/bin/pip install -r protocol-images/ai-agent/requirements.txt
          /tmp/nodera-runtime/bin/python tests/assistant_mcp_smoke.py
          python -m venv /tmp/nodera-bot-runtime
          /tmp/nodera-bot-runtime/bin/pip install -r protocol-images/nodera-bot/requirements.txt
          /tmp/nodera-bot-runtime/bin/python tests/assistant_bot_smoke.py
      - name: Verify gateway reload with stalled VPN streams
        run: python tests/gateway_reload_smoke.py
      - name: Prepare isolated network tests
        timeout-minutes: 5
        uses: ./.github/actions/network-test-dependencies
      - name: Verify disposable WireGuard peer in isolated network
        run: sudo "$(command -v python)" tests/relay_peer_smoke.py
      - name: Verify shared subscription limits in isolated network
        run: sudo unshare --net "$(command -v python)" tests/subscription_limits_smoke.py
      - name: Verify disposable service recovery and runtime upgrades
        run: sudo env PRIVACY_SYSTEMD_TESTS=1 CORE_SYSTEMD_TESTS=1 "$(command -v python)" -m unittest -v tests.api.test_application_operation_systemd tests.api.test_profile_recovery_systemd tests.api.test_subscription_limits_systemd tests.api.test_shadowsocks_systemd tests.api.test_assistant_systemd

  verify-web:
    name: Web checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/node-dependencies
      - run: npm run check

  verify:
    needs: [verify-api, verify-web]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require all verification results
        env:
          API_RESULT: ${{ needs.verify-api.result }}
          WEB_RESULT: ${{ needs.verify-web.result }}
        run: test "$API_RESULT" = success && test "$WEB_RESULT" = success
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select application version
        id: version
        run: |
          version="$(python3 scripts/release-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: package (${{ matrix.architecture }}, ${{ matrix.runner }})
    needs: verify
    if: needs.verify.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/release-cache
      - name: Build PRO archive
        env:
          RELEASE_SKIP_INSTALL: '1'
          RELEASE_CACHE_DIR: ${{ github.workspace }}/.runtime/release-cache
          RELEASE_RUNTIME_DIR: ${{ github.workspace }}/.runtime/release-runtime
          BUILD_COMMIT: ${{ github.sha }}
          RELEASE_EDITION: pro
          RELEASE_CHANNEL: ${{ github.ref_name == 'test-pro' && 'test' || 'production' }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: bash scripts/build-release.sh "outputs/vps-control-pro-linux-${{ matrix.architecture }}.tar.gz"
      - name: Verify prepared PRO archive
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: bash scripts/verify-release.sh "outputs/vps-control-pro-linux-${{ matrix.architecture }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: pro-${{ matrix.architecture }}
          path: outputs/vps-control-pro-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [verify, package]
    if: always() && needs.verify.result == 'success' && needs.package.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          pattern: pro-*
          path: outputs
          merge-multiple: true
      - name: Publish PRO release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "test-pro" ]]; then
            release_tag="pro-test-latest"
            release_title="Test build ${VERSION} (test-pro)"
            release_notes="Rolling PRO test build ${VERSION} for ${GITHUB_SHA}. Not a production release."
            release_flags=(--prerelease)
          else
            release_tag="pro-latest"
            release_title="PRO ${VERSION}"
            release_notes="PRO production release ${VERSION} for ${GITHUB_SHA}"
            release_flags=()
          fi
          gh release delete "$release_tag" --cleanup-tag --yes || true
          gh release create "$release_tag" outputs/vps-control-pro-linux-*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "$release_title" \
            --notes "$release_notes" \
            "${release_flags[@]}" \
            --latest=false
          [[ "$GITHUB_REF_NAME" == "pro" ]] || exit 0
          version_tag="pro-${VERSION}"
          if ! git rev-parse "$version_tag" >/dev/null 2>&1; then
            git tag "$version_tag" "$GITHUB_SHA"
            git push origin "$version_tag"
          fi
