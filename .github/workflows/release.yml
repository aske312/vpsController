name: Publish PRO release

on:
  push:
    branches: [pro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pro-production-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests/api -t . -p 'test_*.py'
      - run: npm ci --include=dev --include=optional --ignore-scripts
      - run: npm run check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Select application version
        id: version
        shell: bash
        run: |
          base="$(node -p 'require("./package.json").version')"
          major_minor="${base%.*}"
          latest="$(git tag --list "pro-v${major_minor}.*" --sort=-v:refname | head -n 1)"
          if [[ -n "$latest" && "$(git rev-list -n 1 "$latest")" == "$GITHUB_SHA" ]]; then
            version="${latest#pro-}"
          elif [[ -z "$latest" ]]; then
            version="v${base}"
          else
            patch="${latest##*.}"
            version="v${major_minor}.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build PRO production archive
        env:
          BUILD_COMMIT: ${{ github.sha }}
          RELEASE_EDITION: pro
          RELEASE_CHANNEL: production
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/build-release.sh "outputs/vps-control-pro-linux-${{ matrix.architecture }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: pro-${{ matrix.architecture }}
          path: outputs/vps-control-pro-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v5
        with:
          pattern: pro-*
          path: outputs
          merge-multiple: true
      - name: Select application version
        id: version
        shell: bash
        run: |
          base="$(node -p 'require("./package.json").version')"
          major_minor="${base%.*}"
          latest="$(git tag --list "pro-v${major_minor}.*" --sort=-v:refname | head -n 1)"
          if [[ -n "$latest" && "$(git rev-list -n 1 "$latest")" == "$GITHUB_SHA" ]]; then
            version="${latest#pro-}"
          elif [[ -z "$latest" ]]; then
            version="v${base}"
          else
            patch="${latest##*.}"
            version="v${major_minor}.$((patch + 1))"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish PRO production release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release delete pro-latest --cleanup-tag --yes || true
          gh release create pro-latest outputs/vps-control-pro-linux-*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "PRO ${VERSION}" \
            --notes "PRO production release ${VERSION} for ${GITHUB_SHA}" \
            --latest=false
          version_tag="pro-${VERSION}"
          if ! git rev-parse "$version_tag" >/dev/null 2>&1; then
            git tag "$version_tag" "$GITHUB_SHA"
            git push origin "$version_tag"
          fi
