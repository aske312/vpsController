name: Test PRO

on:
  pull_request:
    branches: [test-pro, pro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests/api -t . -p 'test_*.py'
      - run: npm ci --include=dev --include=optional --ignore-scripts
      - run: npm run check
