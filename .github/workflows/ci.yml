name: Test PRO

on:
  pull_request:
    branches: [test-pro, pro]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Select application version
        id: version
        shell: bash
        run: |
          version="$(python3 scripts/release-version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests/api -t . -p 'test_*.py'
      - name: Verify disposable WireGuard peer in isolated network
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wireguard-tools
          sudo "$(command -v python)" tests/relay_peer_smoke.py
      - name: Verify shared subscription limits in isolated network
        run: |
          sudo apt-get install -y -qq --no-install-recommends nftables
          sudo unshare --net "$(command -v python)" tests/subscription_limits_smoke.py
      - name: Verify disposable service recovery and runtime upgrades
        run: |
          sudo env PRIVACY_SYSTEMD_TESTS=1 CORE_SYSTEMD_TESTS=1 "$(command -v python)" -m unittest -v tests.api.test_application_operation_systemd tests.api.test_profile_recovery_systemd tests.api.test_subscription_limits_systemd tests.api.test_shadowsocks_systemd
      - run: npm ci --include=dev --include=optional --ignore-scripts
      - run: npm run check

  package:
    name: package (${{ matrix.architecture }}, ${{ matrix.runner }})
    needs: verify
    if: needs.verify.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Verify PRO packaging
        env:
          BUILD_COMMIT: ${{ github.sha }}
          RELEASE_EDITION: pro
          RELEASE_CHANNEL: test
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/build-release.sh "outputs/vps-control-pro-linux-${{ matrix.architecture }}.tar.gz"
