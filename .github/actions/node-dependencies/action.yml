name: Locked Node dependencies
description: Restore an exact platform-specific installation or install from the lockfile
outputs:
  node-version:
    description: Exact Node version used for the installation
    value: ${{ steps.node.outputs.node-version }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      id: node
      with:
        node-version: 22
        cache: npm
    - uses: actions/cache@v4
      id: modules
      with:
        path: node_modules
        key: node-install-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json') }}
    - name: Install or validate locked dependencies
      shell: bash
      env:
        CACHE_HIT: ${{ steps.modules.outputs.cache-hit }}
      run: |
        if [[ "$CACHE_HIT" != 'true' ]] || ! npm ls --depth=0 --include=dev || ! node --input-type=module -e "await import('rolldown')"; then
          npm ci --include=dev --include=optional --ignore-scripts --no-audit --no-fund
        fi
        node --input-type=module -e "await import('rolldown')"
        node scripts/runtime-manifest.mjs
